name: release

on:
  push:
    tags:
      - "v*"

env:
  ORT_VER: "1.20.1"
  ORT_ROOT: /tmp/onnxruntime-linux-x64-1.20.1

jobs:
  assetlib-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Restore scons + ORT cache
        uses: actions/cache@v5
        with:
          path: |
            .scons-cache
            /tmp/onnxruntime-linux-x64-1.20.1
          key: onnx-loader-rel-${{ runner.os }}-${{ hashFiles('godot-cpp/**', 'SConstruct', 'addons/**', 'custom.py') }}
          restore-keys: |
            onnx-loader-rel-${{ runner.os }}-

      - name: install scons
        run: pip install scons

      - name: Build Asset Library zip
        run: |
          set -euo pipefail
          export PKG_VER="${GITHUB_REF_NAME}"
          export ZIP="/tmp/godot-onnx-loader-${PKG_VER}-linux-x86_64.zip"
          chmod +x tools/package_assetlib.sh
          bash tools/package_assetlib.sh
          test -f "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Create GitHub Release with zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes="$(cat <<EOF
          Asset Library / project zip for Godot **4.6+** (Linux x86_64).

          Unzip and copy \`addons/onnx_loader/\` into your Godot project.
          Bundles Microsoft ONNX Runtime ${ORT_VER} (debug + release templates).

          AssetLib submit: Custom download URL → this zip asset.
          EOF
          )"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" \
              --title "$GITHUB_REF_NAME — Asset Library Linux x86_64" \
              --notes "$notes"
          fi
