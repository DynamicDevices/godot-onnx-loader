name: release

on:
  push:
    tags:
      - "v*"

env:
  ORT_VER: "1.22.2"
  ORT_COMMIT: 5630b081cd25e4eccc7516a652ff956e51676794

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      ORT_ROOT: ${{ github.workspace }}/.ort-source-install
      ORT_BUNDLE: "1"
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache/restore@v5
        with:
          path: |
            .scons-cache
            .ort-src
          key: rel-scons-linux-${{ hashFiles('godot-cpp/bindings.py', 'godot-cpp/SConstruct', 'SConstruct', 'src/**') }}-${{ github.sha }}
          restore-keys: |
            rel-scons-linux-
      - run: pip install scons
      - name: Build linux debug+release
        run: |
          set -euo pipefail
          mkdir -p "$SCONS_CACHE"
          chmod +x tools/build_ort_from_source.sh tools/package_assetlib.sh
          ORT_TARGET=host bash tools/build_ort_from_source.sh
          scons -j"$(nproc)" platform=linux target=template_debug
          scons -j"$(nproc)" platform=linux target=template_release
          test -f addons/onnx_loader/bin/libonnx_loader.linux.template_debug.x86_64.so
          test -f addons/onnx_loader/bin/libonnx_loader.linux.template_release.x86_64.so
          test -f addons/onnx_loader/bin/libonnxruntime.so.1
          python3 tools/clear_ort_execstack.py --check addons/onnx_loader/bin/libonnxruntime.so.1
      - uses: actions/upload-artifact@v7
        with:
          name: bins-linux
          path: |
            addons/onnx_loader/bin/libonnx_loader.linux.template_*.so
            addons/onnx_loader/bin/libonnxruntime.so*
          if-no-files-found: error
      - if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            .scons-cache
            .ort-src
          key: rel-scons-linux-${{ hashFiles('godot-cpp/bindings.py', 'godot-cpp/SConstruct', 'SConstruct', 'src/**') }}-${{ github.sha }}

  build-windows:
    # ORT 1.22.2 selects the Visual Studio 17 2022 CMake generator.
    runs-on: windows-2022
    env:
      ORT_ROOT: ${{ github.workspace }}/.ort-source-install
      ORT_BUNDLE: "1"
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache/restore@v5
        with:
          path: |
            .scons-cache
            .ort-src
          key: rel-scons-win-${{ hashFiles('godot-cpp/bindings.py', 'godot-cpp/SConstruct', 'SConstruct', 'src/**') }}-${{ github.sha }}
          restore-keys: |
            rel-scons-win-
      - run: pip install scons
      - name: Setup MSVC (vcvars64 → GITHUB_ENV)
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $vcvars = Join-Path $install "VC\Auxiliary\Build\vcvars64.bat"
          cmd /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match '^(.*?)=(.*)$') {
              $name = $Matches[1]; $value = $Matches[2]
              if ($name -and $name -notmatch '^\(') {
                Add-Content -Path $env:GITHUB_ENV -Value "$name=$value"
              }
            }
          }
      - name: Checkout pinned ORT source
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d .ort-src/onnxruntime/.git ]]; then
            git clone --filter=blob:none --no-checkout https://github.com/microsoft/onnxruntime.git .ort-src/onnxruntime
          fi
          git -C .ort-src/onnxruntime fetch --depth 1 origin "$ORT_COMMIT"
          git -C .ort-src/onnxruntime checkout --detach "$ORT_COMMIT"
          git -C .ort-src/onnxruntime submodule update --init --recursive --depth 1
      - name: Build pinned ORT source
        shell: cmd
        run: >-
          .ort-src\onnxruntime\build.bat --config Release --parallel
          --build_shared_lib --skip_tests --compile_no_warning_as_error
          --cmake_extra_defines onnxruntime_BUILD_UNIT_TESTS=OFF
      - name: Stage source ORT + scons debug+release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .ort-source-install/include,.ort-source-install/lib
          Copy-Item .ort-src/onnxruntime/include/onnxruntime/core/session/onnxruntime_c_api.h .ort-source-install/include/
          Copy-Item .ort-src/onnxruntime/include/onnxruntime/core/session/onnxruntime_ep_c_api.h .ort-source-install/include/
          Get-ChildItem .ort-src/onnxruntime/build -Recurse -Filter onnxruntime.dll | Copy-Item -Destination .ort-source-install/lib/
          Get-ChildItem .ort-src/onnxruntime/build -Recurse -Filter onnxruntime.lib | Copy-Item -Destination .ort-source-install/lib/
          $env:PATH = "$(Split-Path (Get-Command cl).Source);$env:PATH"
          scons -j2 platform=windows target=template_debug
          scons -j2 platform=windows target=template_release
          if (-not (Test-Path addons/onnx_loader/bin/libonnx_loader.windows.template_debug.x86_64.dll)) { throw "debug DLL missing" }
          if (-not (Test-Path addons/onnx_loader/bin/libonnx_loader.windows.template_release.x86_64.dll)) { throw "release DLL missing" }
          if (-not (Test-Path addons/onnx_loader/bin/onnxruntime.dll)) { throw "ORT DLL missing" }
      - uses: actions/upload-artifact@v7
        with:
          name: bins-windows
          path: |
            addons/onnx_loader/bin/libonnx_loader.windows.template_*.dll
            addons/onnx_loader/bin/onnxruntime.dll
          if-no-files-found: error
      - if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            .scons-cache
            .ort-src
          key: rel-scons-win-${{ hashFiles('godot-cpp/bindings.py', 'godot-cpp/SConstruct', 'SConstruct', 'src/**') }}-${{ github.sha }}

  build-macos:
    runs-on: macos-latest
    env:
      ORT_ROOT: ${{ github.workspace }}/.ort-source-install
      ORT_BUNDLE: "1"
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache/restore@v5
        with:
          path: |
            .scons-cache
            .ort-src
          key: rel-scons-mac-${{ hashFiles('godot-cpp/bindings.py', 'godot-cpp/SConstruct', 'SConstruct', 'src/**') }}-${{ github.sha }}
          restore-keys: |
            rel-scons-mac-
      - run: pip install scons
      - name: Build source ORT + scons debug+release
        run: |
          set -euo pipefail
          mkdir -p "$SCONS_CACHE"
          chmod +x tools/build_ort_from_source.sh
          ORT_TARGET=macos-arm64 bash tools/build_ort_from_source.sh
          scons -j"$(sysctl -n hw.ncpu)" platform=macos target=template_debug
          scons -j"$(sysctl -n hw.ncpu)" platform=macos target=template_release
          test -d addons/onnx_loader/bin/libonnx_loader.macos.template_debug.framework
          test -d addons/onnx_loader/bin/libonnx_loader.macos.template_release.framework
          test -f addons/onnx_loader/bin/libonnxruntime.dylib
      - uses: actions/upload-artifact@v7
        with:
          name: bins-macos
          path: |
            addons/onnx_loader/bin/libonnx_loader.macos.template_debug.framework
            addons/onnx_loader/bin/libonnx_loader.macos.template_release.framework
            addons/onnx_loader/bin/libonnxruntime*.dylib
          if-no-files-found: error
      - if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            .scons-cache
            .ort-src
          key: rel-scons-mac-${{ hashFiles('godot-cpp/bindings.py', 'godot-cpp/SConstruct', 'SConstruct', 'src/**') }}-${{ github.sha }}

  build-android:
    runs-on: ubuntu-latest
    env:
      ORT_ROOT: ${{ github.workspace }}/.ort-source-install
      ORT_BUNDLE: "1"
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache/restore@v5
        with:
          path: |
            .scons-cache
            .ort-src
          key: rel-scons-android-${{ hashFiles('godot-cpp/bindings.py', 'godot-cpp/SConstruct', 'SConstruct', 'src/**') }}-${{ github.sha }}
          restore-keys: |
            rel-scons-android-
      - run: pip install scons
      - name: Install pinned Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.1.13356709"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.1.13356709" >> "$GITHUB_ENV"
      - name: Build source ORT + Android arm64 debug/release
        run: |
          set -euo pipefail
          chmod +x tools/build_ort_from_source.sh
          ORT_TARGET=android-arm64 bash tools/build_ort_from_source.sh
          scons -j"$(nproc)" platform=android arch=arm64 target=template_debug use_static_cpp=no
          scons -j"$(nproc)" platform=android arch=arm64 target=template_release use_static_cpp=no
          test -f addons/onnx_loader/bin/libonnx_loader.android.template_debug.arm64.so
          test -f addons/onnx_loader/bin/libonnx_loader.android.template_release.arm64.so
          test -f addons/onnx_loader/bin/libonnxruntime.so
      - uses: actions/upload-artifact@v7
        with:
          name: bins-android
          path: |
            addons/onnx_loader/bin/libonnx_loader.android.template_*.arm64.so
            addons/onnx_loader/bin/libonnxruntime.so
          if-no-files-found: error
      - if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            .scons-cache
            .ort-src
          key: rel-scons-android-${{ hashFiles('godot-cpp/bindings.py', 'godot-cpp/SConstruct', 'SConstruct', 'src/**') }}-${{ github.sha }}

  assetlib-package:
    needs: [build-linux, build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v7
        with:
          name: bins-linux
          path: addons/onnx_loader/bin
      - uses: actions/download-artifact@v7
        with:
          name: bins-windows
          path: addons/onnx_loader/bin
      - uses: actions/download-artifact@v7
        with:
          name: bins-macos
          path: addons/onnx_loader/bin
      - uses: actions/download-artifact@v7
        with:
          name: bins-android
          path: addons/onnx_loader/bin
      - name: Build multi-platform Asset Library zip
        run: |
          set -euo pipefail
          chmod +x tools/package_assetlib_stage.sh
          export PKG_VER="${GITHUB_REF_NAME}"
          export ZIP="/tmp/godot-onnx-loader-${PKG_VER}-assetlib.zip"
          export ZIP_LINUX="/tmp/godot-onnx-loader-${PKG_VER}-linux-x86_64.zip"
          export REQUIRE_MULTI=1
          export MAKE_LINUX_ZIP=1
          bash tools/package_assetlib_stage.sh
          test -f "$ZIP"
          test -f "$ZIP_LINUX"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "ZIP_LINUX=$ZIP_LINUX" >> "$GITHUB_ENV"
          ls -lh "$ZIP" "$ZIP_LINUX"
      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes="$(cat <<EOF
          Asset Library zip for Godot **4.6+**.

          - \`godot-onnx-loader-${GITHUB_REF_NAME}-assetlib.zip\` — **Linux + Windows + macOS arm64 + Android arm64** (debug + release), built from pinned ONNX Runtime ${{ env.ORT_VER }} source
          - \`godot-onnx-loader-${GITHUB_REF_NAME}-linux-x86_64.zip\` — Linux-only (smaller)

          Unzip and copy \`addons/onnx_loader/\` into your Godot project. No \`scons\` required.

          AssetLib: Download provider **Custom** → direct zip URL below.
          EOF
          )"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" "$ZIP_LINUX" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP_LINUX" \
              --title "$GITHUB_REF_NAME — Asset Library (multi-platform)" \
              --notes "$notes"
          fi
