name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke-csv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: install scons
        run: pip install scons

      - name: fetch ONNX Runtime CPU (linux-x64)
        run: |
          set -euo pipefail
          VER=1.20.1
          curl -fsSL -o /tmp/ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${VER}/onnxruntime-linux-x64-${VER}.tgz"
          tar -C /tmp -xzf /tmp/ort.tgz
          echo "ORT_ROOT=/tmp/onnxruntime-linux-x64-${VER}" >> "$GITHUB_ENV"
          echo "ORT_LIB=/tmp/onnxruntime-linux-x64-${VER}/lib" >> "$GITHUB_ENV"

      - name: scons build + smoke-csv
        run: |
          set -euo pipefail
          test -f fixtures/ci-smoke/model.onnx
          test -f fixtures/ci-smoke/demo_inputs.csv
          export LIBRARY_PATH="${ORT_LIB}${LIBRARY_PATH:+:$LIBRARY_PATH}"
          scons platform=linux target=template_debug 2>&1 | tee /tmp/onnx-loader-build.log
          if grep -E '\.(c|cpp|hpp|h):[0-9]+:[0-9]+: warning:' /tmp/onnx-loader-build.log; then
            echo "FAIL: compiler warnings in build log" >&2
            exit 1
          fi
          test -f addons/onnx_loader/bin/libonnx_loader.linux.template_debug.x86_64.so
          test -f addons/onnx_loader/bin/libonnxruntime.so.1
          ! ldd addons/onnx_loader/bin/libonnx_loader.linux.template_debug.x86_64.so | grep -q libonnxruntime
          ! ldd addons/onnx_loader/bin/libonnx_loader.linux.template_debug.x86_64.so | grep -q 'libstdc++'
          scons platform=linux target=template_debug smoke-csv
          scons platform=linux target=template_debug smoke-dlopen-ort
          grep -q 'ONNX_LOADER_CSV_SMOKE_OK' /tmp/onnx-loader-smoke-csv.txt
          grep -q 'hit_rate=' /tmp/onnx-loader-smoke-csv.txt
          grep -q 'ONNX_DLOPEN_TEARDOWN_OK' /tmp/onnx-loader-smoke-dlopen.txt

  package-linux-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: install scons + zip
        run: pip install scons

      - name: build portable zip (addon + MS ORT)
        run: |
          set -euo pipefail
          chmod +x tools/fetch_ms_ort.sh tools/package_linux_portable.sh
          bash tools/package_linux_portable.sh
          test -f /tmp/godot-onnx-loader-linux-x64-portable.zip

      - name: Upload portable Linux package
        uses: actions/upload-artifact@v7
        with:
          name: godot-onnx-loader-linux-x64-portable
          path: /tmp/godot-onnx-loader-linux-x64-portable.zip
          if-no-files-found: error
          retention-days: 30

  nixos-godot-smoke:
    runs-on: [self-hosted, Linux, nixos, esl-nixos]
    env:
      TMPDIR: /var/tmp
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Nix Godot csv_smoke (Julian path)
        run: |
          set -euo pipefail
          rm -f addons/onnx_loader/bin/libonnxruntime.so*
          nix develop --command bash -c '
            set -euo pipefail
            git submodule update --init --recursive
            scons platform=linux target=template_debug
            so=addons/onnx_loader/bin/libonnx_loader.linux.template_debug.x86_64.so
            test -f "$so"
            ! ldd "$so" | grep -q libonnxruntime
            ! ldd "$so" | grep -q libstdc++
            scons platform=linux target=template_debug smoke-dlopen-ort
            bash tools/smoke_bad_model.sh
            bash tools/godot_csv_smoke.sh
          '
