name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke-csv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: install scons
        run: pip install scons

      - name: fetch ONNX Runtime CPU (linux-x64)
        run: |
          set -euo pipefail
          VER=1.20.1
          curl -fsSL -o /tmp/ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${VER}/onnxruntime-linux-x64-${VER}.tgz"
          tar -C /tmp -xzf /tmp/ort.tgz
          echo "ORT_ROOT=/tmp/onnxruntime-linux-x64-${VER}" >> "$GITHUB_ENV"
          echo "ORT_LIB=/tmp/onnxruntime-linux-x64-${VER}/lib" >> "$GITHUB_ENV"

      - name: scons build + smoke-csv
        run: |
          set -euo pipefail
          test -f fixtures/ci-smoke/model.onnx
          test -f fixtures/ci-smoke/demo_inputs.csv
          scons platform=linux target=template_debug
          test -f addons/onnx_loader/bin/libonnx_loader.linux.template_debug.x86_64.so
          scons platform=linux target=template_debug smoke-csv
          grep -q 'ONNX_LOADER_CSV_SMOKE_OK' /tmp/onnx-loader-smoke-csv.txt
          grep -q 'hit_rate=' /tmp/onnx-loader-smoke-csv.txt
