name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ORT_VER: "1.20.1"
  ORT_ROOT: /tmp/onnxruntime-linux-x64-1.20.1

jobs:
  smoke-csv:
    runs-on: ubuntu-latest
    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore scons cache
        uses: actions/cache/restore@v5
        with:
          path: .scons-cache
          key: scons-linux-${{ hashFiles('godot-cpp/bindings.py', 'godot-cpp/SConstruct', 'godot-cpp/tools/**', 'SConstruct', 'custom.py', 'src/**') }}-${{ github.sha }}
          restore-keys: |
            scons-linux-${{ hashFiles('godot-cpp/bindings.py', 'godot-cpp/SConstruct', 'godot-cpp/tools/**', 'SConstruct', 'custom.py', 'src/**') }}-
            scons-linux-

      - name: Restore ORT cache
        id: ort-cache-linux
        uses: actions/cache/restore@v5
        with:
          path: /tmp/onnxruntime-linux-x64-1.20.1
          key: ort-linux-x64-${{ env.ORT_VER }}
          restore-keys: |
            ort-linux-x64-

      - name: install scons
        run: pip install scons

      - name: fetch ONNX Runtime CPU (linux-x64)
        run: |
          set -euo pipefail
          if [[ ! -f "${ORT_ROOT}/lib/libonnxruntime.so.1" ]]; then
            curl -fsSL -o /tmp/ort.tgz \
              "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VER}/onnxruntime-linux-x64-${ORT_VER}.tgz"
            tar -C /tmp -xzf /tmp/ort.tgz
          fi
          echo "ORT_LIB=${ORT_ROOT}/lib" >> "$GITHUB_ENV"

      - name: scons build + smokes + portable zip
        run: |
          set -euo pipefail
          mkdir -p "$SCONS_CACHE"
          test -f fixtures/ci-smoke/model.onnx
          test -f fixtures/ci-smoke/demo_inputs.csv
          export LIBRARY_PATH="${ORT_LIB}${LIBRARY_PATH:+:$LIBRARY_PATH}"
          scons -j"$(nproc)" platform=linux target=template_debug smoke-csv smoke-dlopen-ort \
            2>&1 | tee /tmp/onnx-loader-build.log
          if grep -E '\.(c|cpp|hpp|h):[0-9]+:[0-9]+: warning:' /tmp/onnx-loader-build.log; then
            echo "FAIL: compiler warnings in build log" >&2
            exit 1
          fi
          test -f addons/onnx_loader/bin/libonnx_loader.linux.template_debug.x86_64.so
          test -f addons/onnx_loader/bin/libonnxruntime.so.1
          ! ldd addons/onnx_loader/bin/libonnx_loader.linux.template_debug.x86_64.so | grep -q libonnxruntime
          ! ldd addons/onnx_loader/bin/libonnx_loader.linux.template_debug.x86_64.so | grep -q 'libstdc++'
          grep -q 'ONNX_LOADER_CSV_SMOKE_OK' build/smoke-out/smoke-csv.txt
          grep -q 'hit_rate=' build/smoke-out/smoke-csv.txt
          grep -q 'ONNX_DLOPEN_TEARDOWN_OK' build/smoke-out/smoke-dlopen.txt
          python3 tools/clear_ort_execstack.py --check addons/onnx_loader/bin/libonnxruntime.so.1
          chmod +x tools/ci_julian_regressions.sh
          bash tools/ci_julian_regressions.sh
          scons -j"$(nproc)" platform=linux target=template_release
          chmod +x tools/package_assetlib.sh
          SKIP_SCONS=1 ORT_ROOT="$ORT_ROOT" PKG_VER="ci" \
            ZIP=/tmp/godot-onnx-loader-ci-linux-x86_64.zip \
            bash tools/package_assetlib.sh
          test -f /tmp/godot-onnx-loader-ci-linux-x86_64.zip

      - name: Upload Asset Library Linux zip
        uses: actions/upload-artifact@v7
        with:
          name: godot-onnx-loader-linux-x86_64-assetlib
          path: /tmp/godot-onnx-loader-ci-linux-x86_64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Save scons cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .scons-cache
          key: scons-linux-${{ hashFiles('godot-cpp/bindings.py', 'godot-cpp/SConstruct', 'godot-cpp/tools/**', 'SConstruct', 'custom.py', 'src/**') }}-${{ github.sha }}

      - name: Save ORT cache
        if: always() && steps.ort-cache-linux.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /tmp/onnxruntime-linux-x64-1.20.1
          key: ort-linux-x64-${{ env.ORT_VER }}

  nixos-godot-smoke:
    runs-on: [self-hosted, Linux, nixos, esl-nixos]
    env:
      TMPDIR: /var/tmp
      SCONS_CACHE: /var/tmp/github-runner-cache/scons/godot-onnx-loader
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Nix Godot csv_smoke (Julian path)
        run: |
          set -euo pipefail
          mkdir -p "$SCONS_CACHE"
          rm -f addons/onnx_loader/bin/libonnxruntime.so*
          nix develop --command bash -c '
            set -euo pipefail
            export SCONS_CACHE='"$SCONS_CACHE"'
            git submodule update --init --recursive
            scons -j"$(nproc)" platform=linux target=template_debug smoke-csv smoke-dlopen-ort
            so=addons/onnx_loader/bin/libonnx_loader.linux.template_debug.x86_64.so
            test -f "$so"
            ! ldd "$so" | grep -q libonnxruntime
            ldd "$so" | grep -qE 'libstdc\+\+.*=> /nix/store/'
            bash tools/smoke_bad_model.sh
          '

      - name: Godot 4.6 store ORT smoke
        env:
          NIXPKGS: github:NixOS/nixpkgs/b6018f87da91d19d0ab4cf979885689b469cdd41
        run: |
          set -euo pipefail
          bash tools/godot_46_nix_store_ort.sh

  nixos-godot-46-ms-ort:
    runs-on: [self-hosted, Linux, nixos, esl-nixos]
    env:
      TMPDIR: /var/tmp
      SCONS_CACHE: /var/tmp/github-runner-cache/scons/godot-onnx-loader-46
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Godot 4.6 MS ORT smoke (Julian Nix path)
        run: |
          set -euo pipefail
          mkdir -p "$SCONS_CACHE"
          export SCONS_CACHE
          # Inject Julian's glibc-2.41 execstack failure mode before the script
          # clears/patches — stock MS ORT is often already RW, so CI would miss it.
          bash tools/fetch_ms_ort.sh
          python3 tools/clear_ort_execstack.py --force-rwe \
            "${ORT_ROOT}/lib/libonnxruntime.so.1"
          bash tools/godot_46_ms_ort.sh
          python3 tools/clear_ort_execstack.py --check \
            addons/onnx_loader/bin/libonnxruntime.so.1

  windows-build:
    runs-on: windows-latest
    env:
      ORT_VER: "1.20.1"
      ORT_PLATFORM: win-x64
      ORT_ROOT: ${{ github.workspace }}/.ort/onnxruntime-win-x64-1.20.1
      ORT_BUNDLE: "1"
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore scons cache
        uses: actions/cache/restore@v5
        with:
          path: .scons-cache
          key: scons-windows-${{ hashFiles('godot-cpp/bindings.py', 'godot-cpp/SConstruct', 'godot-cpp/tools/**', 'SConstruct', 'custom.py', 'src/**') }}-${{ github.sha }}
          restore-keys: |
            scons-windows-${{ hashFiles('godot-cpp/bindings.py', 'godot-cpp/SConstruct', 'godot-cpp/tools/**', 'SConstruct', 'custom.py', 'src/**') }}-
            scons-windows-

      - name: Restore ORT cache
        id: ort-cache-win
        uses: actions/cache/restore@v5
        with:
          path: .ort
          key: ort-win-x64-${{ env.ORT_VER }}
          restore-keys: |
            ort-win-x64-

      - name: Install scons
        run: pip install scons

      - name: Setup MSVC (vcvars64 → GITHUB_ENV)
        # Avoid ilammy/msvc-dev-cmd (Node 20, largely unmaintained).
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $install = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $install) { throw "Visual Studio with VC tools not found" }
          $vcvars = Join-Path $install "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "missing $vcvars" }
          cmd /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match '^(.*?)=(.*)$') {
              $name = $Matches[1]
              $value = $Matches[2]
              if ($name -and $name -notmatch '^\(') {
                Add-Content -Path $env:GITHUB_ENV -Value "$name=$value"
              }
            }
          }
          Write-Host "MSVC env from $vcvars"

      - name: Fetch MS ORT (win-x64)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/fetch_ms_ort.sh
          bash tools/fetch_ms_ort.sh
          test -f "${ORT_ROOT}/lib/onnxruntime.dll"
          test -f "${ORT_ROOT}/include/onnxruntime_c_api.h"

      - name: scons Windows template_debug
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SCONS_CACHE"
          export ORT_ROOT ORT_BUNDLE SCONS_CACHE
          # Git for Windows ships usr/bin/link which shadows MSVC link.exe
          # ("link: extra operand '/OPT:REF'"). Prefer the toolchain next to cl.
          CL_BIN="$(dirname "$(command -v cl)")"
          export PATH="${CL_BIN}:${PATH}"
          hash -r
          command -v cl
          command -v link
          link 2>&1 | head -n 2 || true
          scons -j"$(nproc)" platform=windows target=template_debug
          test -f addons/onnx_loader/bin/libonnx_loader.windows.template_debug.x86_64.dll
          test -f addons/onnx_loader/bin/onnxruntime.dll
          scons -j"$(nproc)" platform=windows target=template_debug smoke-csv
          grep -q ONNX_LOADER_CSV_SMOKE_OK build/smoke-out/smoke-csv.txt

      - name: Godot 4.6 headless csv_smoke (Windows)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/fetch_godot_46.sh tools/godot_csv_smoke.sh tools/ensure_demo_extension.sh
          # Git on Windows may materialize demo/addons/onnx_loader as a file symlink;
          # ensure a real directory for Godot.
          if [[ ! -d demo/addons/onnx_loader/bin ]]; then
            rm -f demo/addons/onnx_loader
            mkdir -p demo/addons
            cp -a addons/onnx_loader demo/addons/
          fi
          export GODOT_FORCE_WIN=1
          GODOT="$(bash tools/fetch_godot_46.sh)"
          export GODOT_BIN="$GODOT"
          export ORT_BUNDLE=1
          unset ONNX_ORT_BIN
          bash tools/godot_csv_smoke.sh
          echo "WINDOWS_GODOT_CSV_SMOKE_OK"

      - name: Upload Windows addon bin
        uses: actions/upload-artifact@v7
        with:
          name: godot-onnx-loader-windows-x86_64-bin
          path: |
            addons/onnx_loader/bin/libonnx_loader.windows.template_debug.x86_64.dll
            addons/onnx_loader/bin/onnxruntime.dll
            addons/onnx_loader/onnx_loader.gdextension
          if-no-files-found: error
          retention-days: 14

      - name: Save scons cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .scons-cache
          key: scons-windows-${{ hashFiles('godot-cpp/bindings.py', 'godot-cpp/SConstruct', 'godot-cpp/tools/**', 'SConstruct', 'custom.py', 'src/**') }}-${{ github.sha }}

      - name: Save ORT cache
        if: always() && steps.ort-cache-win.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .ort
          key: ort-win-x64-${{ env.ORT_VER }}

  macos-build:
    runs-on: macos-latest
    env:
      ORT_VER: "1.20.1"
      ORT_PLATFORM: osx-arm64
      ORT_ROOT: ${{ github.workspace }}/.ort/onnxruntime-osx-arm64-1.20.1
      ORT_BUNDLE: "1"
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore scons cache
        uses: actions/cache/restore@v5
        with:
          path: .scons-cache
          key: scons-macos-${{ hashFiles('godot-cpp/bindings.py', 'godot-cpp/SConstruct', 'godot-cpp/tools/**', 'SConstruct', 'custom.py', 'src/**') }}-${{ github.sha }}
          restore-keys: |
            scons-macos-${{ hashFiles('godot-cpp/bindings.py', 'godot-cpp/SConstruct', 'godot-cpp/tools/**', 'SConstruct', 'custom.py', 'src/**') }}-
            scons-macos-

      - name: Restore ORT cache
        id: ort-cache-mac
        uses: actions/cache/restore@v5
        with:
          path: .ort
          key: ort-osx-arm64-${{ env.ORT_VER }}
          restore-keys: |
            ort-osx-arm64-

      - name: Install scons
        run: pip install scons

      - name: Fetch MS ORT (osx-arm64)
        run: |
          set -euo pipefail
          chmod +x tools/fetch_ms_ort.sh
          bash tools/fetch_ms_ort.sh
          test -f "${ORT_ROOT}/include/onnxruntime_c_api.h"
          test -f "${ORT_ROOT}/lib/libonnxruntime.dylib" \
            -o -f "${ORT_ROOT}/lib/libonnxruntime.1.20.1.dylib"

      - name: scons macOS template_debug
        run: |
          set -euo pipefail
          mkdir -p "$SCONS_CACHE"
          export ORT_ROOT ORT_BUNDLE SCONS_CACHE
          scons -j"$(sysctl -n hw.ncpu)" platform=macos target=template_debug
          test -d addons/onnx_loader/bin/libonnx_loader.macos.template_debug.framework
          test -f addons/onnx_loader/bin/libonnxruntime.dylib \
            -o -f addons/onnx_loader/bin/libonnxruntime.1.20.1.dylib
          scons -j"$(sysctl -n hw.ncpu)" platform=macos target=template_debug smoke-csv
          grep -q ONNX_LOADER_CSV_SMOKE_OK build/smoke-out/smoke-csv.txt

      - name: Godot 4.6 headless csv_smoke (macOS)
        run: |
          set -euo pipefail
          chmod +x tools/fetch_godot_46.sh tools/godot_csv_smoke.sh tools/ensure_demo_extension.sh
          GODOT="$(bash tools/fetch_godot_46.sh)"
          export GODOT_BIN="$GODOT"
          export ORT_BUNDLE=1
          unset ONNX_ORT_BIN
          # macOS Gatekeeper may quarantine downloaded Godot in CI — clear if present.
          xattr -dr com.apple.quarantine "$GODOT" 2>/dev/null || true
          xattr -dr com.apple.quarantine "$(dirname "$(dirname "$(dirname "$GODOT")")")" 2>/dev/null || true
          bash tools/godot_csv_smoke.sh
          echo "MACOS_GODOT_CSV_SMOKE_OK"

      - name: Upload macOS addon bin
        uses: actions/upload-artifact@v7
        with:
          name: godot-onnx-loader-macos-arm64-bin
          path: |
            addons/onnx_loader/bin/libonnx_loader.macos.template_debug.framework
            addons/onnx_loader/bin/libonnxruntime*.dylib
            addons/onnx_loader/onnx_loader.gdextension
          if-no-files-found: error
          retention-days: 14

      - name: Save scons cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .scons-cache
          key: scons-macos-${{ hashFiles('godot-cpp/bindings.py', 'godot-cpp/SConstruct', 'godot-cpp/tools/**', 'SConstruct', 'custom.py', 'src/**') }}-${{ github.sha }}

      - name: Save ORT cache
        if: always() && steps.ort-cache-mac.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .ort
          key: ort-osx-arm64-${{ env.ORT_VER }}
